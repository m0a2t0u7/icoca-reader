plugins {
    id 'com.android.application'
}

android {
    namespace 'jp.latte.icocareader'
    compileSdk 34

    defaultConfig {
        applicationId 'jp.latte.icocareader'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
